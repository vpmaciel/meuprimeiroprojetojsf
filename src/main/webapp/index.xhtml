<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets">

<h:head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Minha Primeira Página JSF</title>
</h:head>

<h:body>
	<h:form id="formPessoa">
		<h:panelGrid columns="2">
		
			<h:outputLabel value="Id:" />
			<h:inputText value="#{pessoaBean.pessoa.id}" readonly="true"/>
			
			<h:outputLabel value="Nome:" />
			<h:inputText value="#{pessoaBean.pessoa.nome}" />
			
			<h:outputLabel value="Sobrenome:" />
			<h:inputText value="#{pessoaBean.pessoa.sobrenome}" />
			
			<h:outputLabel value="Idade:" />
			<h:inputText value="#{pessoaBean.pessoa.idade}" />
			
			<h:outputLabel value="Nascimento:" />
			<h:inputText value="#{pessoaBean.pessoa.nascimento}">
			
            <f:convertDateTime pattern="dd/MM/yyyy" timeZone="America/Sao_Paulo" />
            </h:inputText>
			
			<h:outputText value="" />
			<h:commandButton value="Salvar" action="#{pessoaBean.salvar}" />			
			
			<h:outputText value="" />
			<h:commandButton value="Novo" action="#{pessoaBean.novo}" />
			
			<h:outputText value="" />
			<h:commandButton value="Remover" action="#{pessoaBean.remove}" />
			
			<h:dataTable value="#{pessoaBean.pessoas}" var="pessoa">
			    
			    <!-- Coluna ID -->
			    <h:column>
			        <f:facet name="header">ID</f:facet>
			        <h:outputText value="#{pessoa.id}" />
			    </h:column>
			
			    <!-- Coluna Nome -->
			    <h:column>
			        <f:facet name="header">Nome</f:facet>
			        <h:outputText value="#{pessoa.nome}" />
			    </h:column>
			
			    <!-- Coluna Sobrenome -->
			    <h:column>
			        <f:facet name="header">Sobrenome</f:facet>
			        <h:outputText value="#{pessoa.sobrenome}" />
			    </h:column>
			
			    <!-- Coluna Idade -->
			    <h:column>
			        <f:facet name="header">Idade</f:facet>
			        <h:outputText value="#{pessoa.idade}" />
			    </h:column>
			
			    <!-- Coluna Nascimento -->
			    <h:column>
			        <f:facet name="header">Nascimento</f:facet>
			        <h:outputText value="#{pessoa.nascimento}" />
			    </h:column>
			    
			    <h:column>
			        <f:facet name="header"></f:facet>
			        <h:commandLink value="Editar">
			        	<f:setPropertyActionListener target="#{pessoaBean.pessoa}" value="#{pessoa}" />
			        </h:commandLink>
			    </h:column>
			
			
			<h:column>
			        <f:facet name="header"></f:facet>
			        <h:commandLink value="Excluir" action="#{pessoaBean.remove}">
			        	<f:setPropertyActionListener target="#{pessoaBean.pessoa}" value="#{pessoa}" />
			        </h:commandLink>
			    </h:column>
			
			
			</h:dataTable>
			
		</h:panelGrid>
	</h:form>
</h:body>

</html>
