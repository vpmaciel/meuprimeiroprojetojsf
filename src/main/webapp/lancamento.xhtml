<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets">

<h:head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Minha Primeira Página JSF</title>
</h:head>

<h:body>
	<ui:include src="/menu.xhtml" />
	<h:form id="formLancamento">
		<h:panelGrid columns="2">
			<f:facet name="header">
				<h:outputText value="Lancamentos" />
			</f:facet>

			<h:outputLabel value="Id:" />
			<h:inputText value="#{lancamentoBean.lancamento.id}" readonly="true" />

			<h:outputLabel value="Nota:" />
			<h:inputText value="#{lancamentoBean.lancamento.numeroNotaFiscal}" />

			<h:outputLabel value="Origem" />
			<h:inputText value="#{lancamentoBean.lancamento.empresaOrigem}" />

			<h:outputLabel value="Destino:" />
			<h:inputText value="#{lancamentoBean.lancamento.empresaDestino}" />

		</h:panelGrid>

		<h:panelGroup>
			<h:commandButton value="Salvar" action="#{lancamentoBean.salvar}"
				image="/resources/img/save_32px.png" title="Salvar" />
			<h:commandButton value="Novo" action="#{lancamentoBean.novo}"
				image="/resources/img/plus_32px.png" title="Novo" />
			<h:commandButton value="Remover" action="#{lancamentoBean.remove}"
				image="/resources/img/delete_32px.png" title="Remover" />
			<h:commandButton value="Limpar" type="reset"
				image="/resources/img/cancel_32px.png" title="Limpar" />
		</h:panelGroup>

		<h:dataTable value="#{lancamentoBean.lancamentoList}" var="lancIterator" border="1"
			cellpadding="5">
			<f:facet name="header">Lista de Lançamentos Cadastrados</f:facet>
			<h:column>
				<f:facet name="header">ID</f:facet>
				<h:outputText value="#{lancIterator.id}" />
			</h:column>
			<h:column>
				<f:facet name="header">Nota Fiscal</f:facet>
				<h:outputText value="#{lancIterator.numeroNotaFiscal}" />
			</h:column>
			<h:column>
				<f:facet name="header">Origem</f:facet>
				<h:outputText value="#{lancIterator.empresaOrigem}" />
			</h:column>
			<h:column>
				<f:facet name="header">Nota Fiscal</f:facet>
				<h:outputText value="#{lancIterator.empresaDestino}" />
			</h:column>
			<h:column>
				<f:facet name="header">Usuario</f:facet>
				<h:outputText value="#{lancIterator.usuario.nome}" />
			</h:column>
			<h:column>
				<f:facet name="header">Editar</f:facet>
				<h:commandLink title="Editar">
					<h:graphicImage value="/resources/img/edit_32px.png" />
					<f:setPropertyActionListener target="#{lancamentoBean.lancamento}"
						value="#{lancIterator}" />
				</h:commandLink>
			</h:column>
			<h:column>
				<f:facet name="header">Excluir</f:facet>
				<h:commandLink title="Excluir" action="#{lancamentoBean.remove}">
					<h:graphicImage value="/resources/img/delete_32px.png" />
					<f:setPropertyActionListener target="#{lancamentoBean.lancamento}"
						value="#{lancIterator}" />
				</h:commandLink>
			</h:column>
		</h:dataTable>
	</h:form>
</h:body>

</html>
